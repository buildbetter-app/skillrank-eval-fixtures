<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal Desk</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #222; }
      header, main { max-width: 1100px; margin: auto; padding: 24px; }
      .cards { display: flex; gap: 16px; }
      .card { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
      button { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 10px 16px; }
    </style>
  </head>
  <body>
    <header><h1>Signal Desk</h1><p>Customer evidence for product teams.</p></header>
    <main>
      <div class="cards">
        <section class="card"><h2>Onboarding friction</h2><p>18 mentions</p><button>Open</button></section>
        <section class="card"><h2>Export requests</h2><p>11 mentions</p><button>Open</button></section>
        <section class="card"><h2>Mobile access</h2><p>7 mentions</p><button>Open</button></section>
      </div>
    </main>
  </body>
</html>
