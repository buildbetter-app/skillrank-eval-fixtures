<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Queue</title>
    <style>
      body { font-family: system-ui; margin: 0; min-height: 100vh; background: #f3f4f6; }
      main { padding: 32px; }
      #sheet { position: fixed; inset: auto 0 0; padding: 24px; background: white; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 32px rgba(0,0,0,.14); }
      #handle { width: 44px; height: 5px; border-radius: 99px; background: #c7c9d1; margin: 0 auto 20px; }
    </style>
  </head>
  <body>
    <main><h1>Today’s queue</h1><p>Three customer requests need review.</p></main>
    <section id="sheet" aria-label="Request details">
      <div id="handle"></div>
      <h2>Billing export</h2>
      <p>Seven customers asked for scheduled CSV delivery.</p>
    </section>
  </body>
</html>
